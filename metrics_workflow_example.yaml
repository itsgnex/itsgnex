name: Metrics
on:
  # Schedule updates (daily)
  schedule: [{cron: "0 0 * * *"}]
  # Run manually or on push
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # You need to create a Personal Access Token (PAT) with 'repo' scope 
          # and add it to your repository secrets as METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: itsgnex
          template: classic
          base: ""
          config_timezone: America/New_York # Set your timezone
          
          # Plugin: Isometric Calendar (The 3D City)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
